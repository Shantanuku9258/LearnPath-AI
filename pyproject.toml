[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnpath-ai"
version = "0.1.0"
description = "Intelligent learning activity recommendation system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "LearnPath AI contributors" }]
keywords = ["recommendation", "learning-path", "mastery", "mysql"]
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyMySQL>=1.1,<2.0",
  "cryptography>=42.0,<47.0",
  "scikit-learn>=1.5,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
learnpath-ai = "learnpath_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "unit: isolated unit tests",
  "integration: MySQL and pipeline integration tests",
  "acceptance: challenge acceptance criteria",
  "mysql: requires a live MySQL server and LEARNPATH_MYSQL_IT=1",
]
